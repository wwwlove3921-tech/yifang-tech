<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><defs><filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#163D2E" flood-opacity=".07"/></filter><linearGradient id="mintFade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2F5E8"/><stop offset="1" stop-color="#F4F6F0"/></linearGradient><linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65E2BE" stop-opacity=".45"/><stop offset="1" stop-color="#65E2BE" stop-opacity="0"/></linearGradient><pattern id="dot" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#AFC6B6" opacity=".32"/></pattern></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:0} .mono{font-family:"SF Mono",Menlo,monospace}</style><rect x="0" y="0" width="1440" height="880" rx="28" fill="#F4F6F0" stroke="none" /><text x="44" y="67" fill="#103E36" font-size="32" font-weight="600" >账目合规分析，让问题有迹可循</text><text x="44" y="108" fill="#71837B" font-size="21" font-weight="400" >AI 整理异常线索，专业人员结合业务与资料作出判断。</text><rect x="1172" y="44" width="224" height="34" rx="17" fill="#F7E8D5" stroke="none" /><text x="1284" y="67" fill="#8D6435" font-size="16" font-weight="500" text-anchor="middle">合成示例 · 待专业复核</text><rect x="44" y="158" width="420" height="111" rx="22" fill="#fff" stroke="none" /><rect x="64" y="181" width="58" height="58" rx="18" fill="#E7E1F5" stroke="none" /><g transform="translate(77 194) scale(0.96875)"><path d="M16 6C11 1 5 5 6 11C1 14 3 21 7 22C6 28 13 32 16 27M16 6C21 1 27 5 26 11C31 14 29 21 25 22C26 28 19 32 16 27M16 6V27M8 12L12 14M24 12L20 14M8 22L12 20M24 22L20 20" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="141" y="202" fill="#103E36" font-size="24" font-weight="600" >01  AI 提示差异</text><text x="141" y="237" fill="#71837B" font-size="17" font-weight="400" >把需要关注的问题明确出来</text><rect x="510" y="158" width="420" height="111" rx="22" fill="#fff" stroke="none" /><rect x="530" y="181" width="58" height="58" rx="18" fill="#E8F2E9" stroke="none" /><g transform="translate(543 194) scale(0.96875)"><path d="M12 10L16 6C21 1 31 11 26 16L22 20M20 22L16 26C11 31 1 21 6 16L10 12M11 21L21 11" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="607" y="202" fill="#103E36" font-size="24" font-weight="600" >02  关联业务证据</text><text x="607" y="237" fill="#71837B" font-size="17" font-weight="400" >从数字回到实际业务</text><rect x="976" y="158" width="420" height="111" rx="22" fill="#fff" stroke="none" /><rect x="996" y="181" width="58" height="58" rx="18" fill="#F7E8D5" stroke="none" /><g transform="translate(1009 194) scale(0.96875)"><path d="M22 9A6 6 0 1 1 10 9A6 6 0 1 1 22 9M5 29V25C5 16 27 16 27 25V29" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1073" y="202" fill="#103E36" font-size="24" font-weight="600" >03  人工复核确认</text><text x="1073" y="237" fill="#71837B" font-size="17" font-weight="400" >保留意见与处理轨迹</text><path d="M478 213H495M489 207L495 213L489 219" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M944 213H961M955 207L961 213L955 219" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="44" y="293" width="420" height="451" rx="22" fill="#fff" stroke="none" /><text x="70" y="338" fill="#103E36" font-size="23" font-weight="600" >服务采购 / 示范业务 A</text><text x="70" y="372" fill="#71837B" font-size="17" font-weight="400" >账目与业务资料对照</text><rect x="70" y="401" width="368" height="77" rx="15" fill="#F7E8D5" stroke="none" /><circle cx="91" cy="427" r="4" fill="#956537" stroke="none" stroke-width="1"/><text x="106" y="433" fill="#956537" font-size="20" font-weight="600" >付款主体需核实</text><text x="89" y="460" fill="#956537" font-size="16" font-weight="400" >合同方与付款记录存在差异</text><rect x="70" y="497" width="368" height="77" rx="15" fill="#E7E1F5" stroke="none" /><circle cx="91" cy="523" r="4" fill="#73618B" stroke="none" stroke-width="1"/><text x="106" y="529" fill="#73618B" font-size="20" font-weight="600" >验收材料待补充</text><text x="89" y="556" fill="#73618B" font-size="16" font-weight="400" >当前关联目录中尚未发现</text><rect x="70" y="593" width="368" height="77" rx="15" fill="#E8F2E9" stroke="none" /><circle cx="91" cy="619" r="4" fill="#103E36" stroke="none" stroke-width="1"/><text x="106" y="625" fill="#103E36" font-size="20" font-weight="600" >凭证与原件已关联</text><text x="89" y="652" fill="#103E36" font-size="16" font-weight="400" >可回看原始电子文件</text><rect x="510" y="293" width="420" height="451" rx="22" fill="#fff" stroke="none" /><text x="536" y="338" fill="#103E36" font-size="23" font-weight="600" >同一笔业务的资料关联</text><rect x="536" y="374" width="368" height="70" rx="14" fill="#F5F7F2" stroke="none" /><g transform="translate(553 393) scale(0.90625)"><path d="M7 3H17L23 9V29H7ZM17 3V9H23M11 15H19M11 20H19M11 25H16" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="597" y="403" fill="#103E36" font-size="20" font-weight="500" >采购合同</text><text x="597" y="428" fill="#71837B" font-size="16" font-weight="400" >业务范围、交易主体</text><rect x="536" y="457" width="368" height="70" rx="14" fill="#F5F7F2" stroke="none" /><g transform="translate(553 476) scale(0.90625)"><path d="M3 8H13L16 11H29V28H3ZM3 8V4H12L16 8H29V11" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="597" y="486" fill="#103E36" font-size="20" font-weight="500" >电子凭证</text><text x="597" y="511" fill="#71837B" font-size="16" font-weight="400" >原件与账目相互关联</text><rect x="536" y="540" width="368" height="70" rx="14" fill="#F5F7F2" stroke="none" /><g transform="translate(553 559) scale(0.90625)"><path d="M4 4V28H29M9 22V16M16 22V11M23 22V5" fill="none" stroke="#103E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="597" y="569" fill="#103E36" font-size="20" font-weight="500" >付款记录</text><text x="597" y="594" fill="#71837B" font-size="16" font-weight="400" >金额、时间与交易方</text><rect x="536" y="623" width="368" height="70" rx="14" fill="#FCF4E8" stroke="none" /><g transform="translate(553 642) scale(0.90625)"><path d="M29 16A13 13 0 1 1 3 16A13 13 0 1 1 29 16M16 8V17L22 21" fill="none" stroke="#9B703F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="597" y="652" fill="#103E36" font-size="20" font-weight="500" >验收记录</text><text x="597" y="677" fill="#71837B" font-size="16" font-weight="400" >待补充并重新核对</text><rect x="976" y="293" width="420" height="451" rx="22" fill="#103E36" stroke="none" /><text x="1002" y="338" fill="#fff" font-size="23" font-weight="600" >复核与处理</text><rect x="1002" y="365" width="146" height="34" rx="17" fill="#365B4E" stroke="none" /><text x="1075" y="388" fill="#D8EACA" font-size="16" font-weight="500" text-anchor="middle">等待材料补充</text><text x="1002" y="443" fill="#AACBBA" font-size="17" font-weight="500" >复核意见</text><text x="1002" y="482" fill="#fff" font-size="23" font-weight="400" >确认付款主体关系，</text><text x="1002" y="519" fill="#fff" font-size="23" font-weight="400" >补充验收依据后继续复核。</text><path d="M1002 548H1370" fill="none" stroke="#456659" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1010" cy="580" r="4" fill="#65E2BE" stroke="none" stroke-width="1"/><text x="1028" y="588" fill="#DFEDE5" font-size="19" font-weight="400" >AI 提示已记录</text><circle cx="1010" cy="623" r="4" fill="#65E2BE" stroke="none" stroke-width="1"/><text x="1028" y="631" fill="#DFEDE5" font-size="19" font-weight="400" >补件任务已关联</text><circle cx="1010" cy="666" r="4" fill="#6A887B" stroke="none" stroke-width="1"/><text x="1028" y="674" fill="#ADCBBD" font-size="19" font-weight="400" >复核结论待确认</text><rect x="44" y="770" width="1352" height="49" rx="16" fill="#E9EFE5" stroke="none" /><text x="69" y="801" fill="#103E36" font-size="19" font-weight="400" >线索不等于结论；保留来源、依据和复核意见，让处理过程可追溯。</text><text x="44" y="855" fill="#71837B" font-size="15" font-weight="500" >一方科技  /  AI 应用与企业数字化</text><text x="1396" y="855" fill="#71837B" font-size="15" font-weight="400" text-anchor="end">应用方案示意</text></svg>